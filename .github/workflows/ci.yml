name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests evals

      - name: Unit + pipeline tests
        run: pytest -q

      - name: Eval gate (unsafe approvals must be 0)
        run: python evals/run_eval.py --provider fallback
