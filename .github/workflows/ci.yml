name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests evals scripts

      - name: Unit + pipeline tests
        run: pytest -q

      # The offline baseline cannot read vendor text, so it is EXPECTED to approve the 8 llm_only
      # cases. This gate pins that behaviour: the deterministic layer must keep catching every
      # rule-detectable case, and the baseline's blind spots must not grow.
      - name: Eval gate (offline baseline)
        run: python evals/run_eval.py --provider fallback --max-unsafe 8 --min-accuracy 0.79
